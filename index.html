<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102c45">
  <title>Ministerio de Alabanza</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .recover-link { display:block; margin:12px auto 0; background:none; border:0;
      color:#1765cb; font-size:14px; font-weight:700; text-decoration:underline; cursor:pointer; }
    .recovery-shade { position:fixed; inset:0; z-index:9999; background:#0a223ac9;
      display:flex; align-items:center; justify-content:center; padding:16px; }
    .recovery-card { width:min(430px,100%); max-height:95dvh; overflow:auto;
      padding:clamp(22px,4vw,36px); border-radius:20px; background:#fff;
      box-shadow:0 24px 65px #0004; font-family:Inter,system-ui,sans-serif; }
    .recovery-card h2 { margin:0 0 8px; color:#192b41; text-align:center; }
    .recovery-card .muted { color:#64748b; text-align:center; font-size:14px; }
    .recovery-card label { display:block; margin:18px 0 6px; font-weight:700; color:#24364e; font-size:13px; }
    .recovery-card input { width:100%; padding:12px; border:1px solid #d7e0ed;
      border-radius:9px; box-sizing:border-box; font-size:16px; }
    .recovery-card .primary { width:100%; margin-top:20px; padding:12px; background:#1372ee;
      color:white; border:0; border-radius:9px; font-weight:700; cursor:pointer; }
    .recovery-card .secondary { width:100%; margin-top:10px; padding:10px; border:0;
      background:transparent; color:#1765cb; cursor:pointer; }
    .recovery-status { min-height:20px; font-size:13px; line-height:1.5; margin-top:12px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

  <script>
    // Recuperación de contraseña, compatible con el app.js existente.
    (() => {
      const authClient = typeof supa !== 'undefined' ? supa : null;
      let recoveryInProgress = new URLSearchParams(location.hash.slice(1)).get('type') === 'recovery';
      let showChangePassword = recoveryInProgress;

      function safeText(element, message, ok = false) {
        element.textContent = message;
        element.style.color = ok ? '#167044' : '#b42332';
      }
      function removeRecovery() {
        document.getElementById('recovery-overlay')?.remove();
      }
      function modal(mode) {
        removeRecovery();
        const shade = document.createElement('div');
        shade.id = 'recovery-overlay';
        shade.className = 'recovery-shade';
        const card = document.createElement('section');
        card.className = 'recovery-card';
        card.setAttribute('role', 'dialog');
        card.setAttribute('aria-modal', 'true');
        card.setAttribute('aria-label', mode === 'change' ? 'Cambiar contraseña' : 'Recuperar contraseña');
        const heading = document.createElement('h2');
        heading.textContent = mode === 'change' ? 'Crear nueva contraseña' : 'Recuperar contraseña';
        const info = document.createElement('p');
        info.className = 'muted';
        info.textContent = mode === 'change'
          ? 'Escribe una contraseña nueva para tu cuenta.'
          : 'Te enviaremos un enlace a tu correo registrado en Supabase.';
        const form = document.createElement('form');
        const label = document.createElement('label');
        label.textContent = mode === 'change' ? 'Nueva contraseña' : 'Correo electrónico';
        const input = document.createElement('input');
        input.type = mode === 'change' ? 'password' : 'email';
        input.required = true;
        input.autocomplete = mode === 'change' ? 'new-password' : 'email';
        input.placeholder = mode === 'change' ? 'Mínimo 8 caracteres' : 'correo@gmail.com';
        if (mode === 'change') input.minLength = 8;
        if (mode === 'request') {
          input.value = document.getElementById('login-email')?.value || '';
        }
        const button = document.createElement('button');
        button.type = 'submit';
        button.className = 'primary';
        button.textContent = mode === 'change' ? 'Guardar contraseña' : 'Enviar enlace';
        const status = document.createElement('p');
        status.className = 'recovery-status';
        status.setAttribute('role', 'status');
        const back = document.createElement('button');
        back.type = 'button';
        back.className = 'secondary';
        back.textContent = 'Volver';
        back.addEventListener('click', () => {
          if (mode === 'change') {
            // No cerrar por accidente un enlace de recuperación válido.
            if (!confirm('¿Salir sin cambiar la contraseña?')) return;
          }
          removeRecovery();
        });
        form.append(label, input, button, status);
        card.append(heading, info, form, back);
        shade.append(card);
        document.body.append(shade);
        input.focus();

        form.addEventListener('submit', async event => {
          event.preventDefault();
          if (!authClient) {
            safeText(status, 'No se pudo cargar Supabase. Revisa tu conexión.');
            return;
          }
          button.disabled = true;
          button.textContent = 'Procesando...';
          try {
            if (mode === 'request') {
              const { error } = await authClient.auth.resetPasswordForEmail(input.value.trim(), {
                redirectTo: location.origin + location.pathname
              });
              if (error) throw error;
              safeText(status, 'Si la cuenta existe, recibirás un correo con el enlace de recuperación. Revisa también Spam.', true);
            } else {
              const { error } = await authClient.auth.updateUser({ password: input.value });
              if (error) throw error;
              recoveryInProgress = false;
              showChangePassword = false;
              history.replaceState(null, '', location.pathname);
              safeText(status, 'Contraseña actualizada correctamente. Ya puedes utilizar tu cuenta.', true);
              button.remove();
              back.textContent = 'Continuar';
            }
          } catch (error) {
            safeText(status, 'No se pudo completar: ' + (error?.message || 'intenta nuevamente.'));
          } finally {
            button.disabled = false;
            if (button.isConnected) button.textContent = mode === 'change' ? 'Guardar contraseña' : 'Enviar enlace';
          }
        });
      }

      // app.js dibuja la pantalla de login dinámicamente; se añade el enlace cada vez.
      function insertForgotLink() {
        const form = document.getElementById('login-form');
        if (!form || form.querySelector('#forgot-password')) return;
        const forgot = document.createElement('button');
        forgot.id = 'forgot-password';
        forgot.type = 'button';
        forgot.className = 'recover-link';
        forgot.textContent = '¿Olvidaste tu contraseña?';
        forgot.addEventListener('click', () => modal('request'));
        form.append(forgot);
      }
      const observer = new MutationObserver(insertForgotLink);
      observer.observe(document.getElementById('app'), { childList: true, subtree: true });
      insertForgotLink();

      if (authClient) {
        authClient.auth.onAuthStateChange((event) => {
          if (event === 'PASSWORD_RECOVERY') {
            recoveryInProgress = true;
            showChangePassword = true;
            modal('change');
          }
        });
      }
      // La URL de recuperación puede cargar antes que el evento de Supabase.
      if (showChangePassword) {
        modal('change');
      }
    })();
  </script>
</body>
</html>
